deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  detail: >-
    No deprecation policy is published for the Rokwire platform, no Sunset or Deprecation header
    was observed on any probed response, and neither OpenAPI marks an operation deprecated. The
    only deprecation signal available is the semver major on a building block (Gateway is at 2.x,
    Core still at 1.x).
change_communication:
  channels:
  - kind: source
    url: https://github.com/rokwire
    detail: >-
      Every building block is a public Apache-2.0 repository with tagged releases and a
      CHANGELOG. This is where a consumer actually learns what changed — the institution ships no
      changelog on the API host itself.
  - kind: live-version-endpoint
    url: https://api.rokwire.illinois.edu/core/version
    detail: Unauthenticated, so a client can detect a deployed change without credentials.
  changelog_on_api_host: false
  status_page: https://status.illinois.edu/
other_surfaces:
- surface: Course Explorer (CISAPI)
  base: https://courses.illinois.edu/cisapp/explorer
  versioning: >-
    None advertised. The XML vocabulary is namespaced http://rest.cis.illinois.edu with no version
    in the path, the namespace or a header. Content versions by academic term rather than by API
    version — schedule.xml enumerates calendarYears.
- surface: IDEALS OAI-PMH
  base: https://www.ideals.illinois.edu/oai-pmh
  versioning: >-
    Protocol-versioned by OAI-PMH itself — Identify reports protocolVersion 2.0, granularity
    YYYY-MM-DDThh:mm:ssZ and deletedRecord "persistent", meaning deletions stay harvestable
    forever. earliestDatestamp 2022-06-06 marks the migration off the previous DSpace platform.
- surface: Illinois Data Bank
  base: https://databank.illinois.edu
  versioning: >-
    Datasets version in the identifier, not the API — DOIs carry an explicit _V1 suffix
    (10.13012/B2IDB-0887518_V1) so every revision is separately citable and the prior version
    stays resolvable. The JSON surface itself is unversioned.
