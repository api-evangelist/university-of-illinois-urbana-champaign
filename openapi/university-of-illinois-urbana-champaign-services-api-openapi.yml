components:
  schemas:
    AccountAuthType:
      required:
      - id
      - code
      - identifier
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        identifier:
          type: string
        params:
          type: object
          additionalProperties: true
          nullable: true
        active:
          type: boolean
        unverified:
          type: boolean
    _services_req_credential_forgot_complete:
      required:
      - credential_id
      - reset_code
      type: object
      properties:
        credential_id:
          type: string
        reset_code:
          type: string
        params:
          type: object
          anyOf:
          - $ref: '#/components/schemas/_shared_req_ParamsSetEmailCredential'
    ApplicationConfig:
      required:
      - id
      - app_type_id
      - version
      - data
      type: object
      properties:
        id:
          type: string
          readOnly: true
        app_type_id:
          type: string
        org_id:
          type: string
        version:
          type: string
          description: conforms major.minor.patch format
        data:
          type: object
    _shared_res_ParamsOIDC:
      type: object
      description: Auth login response params for auth_type="oidc" (or variants)
      properties:
        oidc_token:
          type: object
          properties:
            id_token:
              type: string
            access_token:
              type: string
            refresh_token:
              type: string
            token_type:
              type: string
        redirect_uri:
          type: string
    _shared_res_LoginUrl:
      required:
      - login_url
      type: object
      properties:
        login_url:
          type: string
        params:
          type: object
          description: Params to be submitted with 'login' request (if necessary)
    ApplicationType:
      required:
      - id
      - identifier
      type: object
      properties:
        id:
          readOnly: true
          type: string
        identifier:
          type: string
        name:
          type: string
        versions:
          type: array
          items:
            type: string
    _shared_req_CredsOIDC:
      type: string
      description: "Auth login creds for auth_type=\"oidc\" (or variants)\n  - full redirect URI received from OIDC provider\n"
    _shared_req_Login:
      required:
      - auth_type
      - app_type_identifier
      - org_id
      - api_key
      - device
      type: object
      properties:
        auth_type:
          type: string
          enum:
          - email
          - twilio_phone
          - illinois_oidc
          - anonymous
          - username
        app_type_identifier:
          type: string
        org_id:
          type: string
        api_key:
          type: string
        creds:
          anyOf:
          - $ref: '#/components/schemas/_shared_req_CredsEmail'
          - $ref: '#/components/schemas/_shared_req_CredsTwilioPhone'
          - $ref: '#/components/schemas/_shared_req_CredsOIDC'
          - $ref: '#/components/schemas/_shared_req_CredsAPIKey'
          - $ref: '#/components/schemas/_shared_req_CredsUsername'
        params:
          type: object
          anyOf:
          - $ref: '#/components/schemas/_shared_req_ParamsEmail'
          - $ref: '#/components/schemas/_shared_req_ParamsOIDC'
          - $ref: '#/components/schemas/_shared_req_ParamsNone'
          - $ref: '#/components/schemas/_shared_req_ParamsUsername'
        device:
          $ref: '#/components/schemas/Device'
        profile:
          $ref: '#/components/schemas/ProfileNullable'
        privacy:
          $ref: '#/components/schemas/PrivacyNullable'
        preferences:
          type: object
          nullable: true
        username:
          type: string
          nullable: true
    PublicAccount:
      required:
      - id
      - is_connection
      - profile
      - identifiers
      type: object
      properties:
        id:
          type: string
        verified:
          type: boolean
        is_following:
          type: boolean
        is_connection:
          type: boolean
        profile:
          $ref: '#/components/schemas/ProfileNullable'
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/PublicAccountIdentifier'
    _shared_req_ParamsSetEmailCredential:
      required:
      - new_password
      - confirm_password
      type: object
      properties:
        new_password:
          type: string
        confirm_password:
          type: string
    InactiveExpirePolicy:
      type: object
      required:
      - active
      - inactivity_period
