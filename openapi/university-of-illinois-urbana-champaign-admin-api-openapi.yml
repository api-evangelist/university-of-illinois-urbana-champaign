components:
  schemas:
    ApplicationConfig:
      required:
      - id
      - app_type_id
      - version
      - data
      type: object
      properties:
        id:
          type: string
          readOnly: true
        app_type_id:
          type: string
        org_id:
          type: string
        version:
          type: string
          description: conforms major.minor.patch format
        data:
          type: object
    _shared_res_ParamsOIDC:
      type: object
      description: Auth login response params for auth_type="oidc" (or variants)
      properties:
        oidc_token:
          type: object
          properties:
            id_token:
              type: string
            access_token:
              type: string
            refresh_token:
              type: string
            token_type:
              type: string
        redirect_uri:
          type: string
    ApplicationType:
      required:
      - id
      - identifier
      type: object
      properties:
        id:
          readOnly: true
          type: string
        identifier:
          type: string
        name:
          type: string
        versions:
          type: array
          items:
            type: string
    _admin_req_grant-permissions-to-role:
      required:
      - permissions
      type: object
      properties:
        permissions:
          type: array
          items:
            type: string
    _shared_res_Login_Mfa:
      required:
      - enrolled
      - account_id
      - session_id
      - state
      type: object
      properties:
        enrolled:
          type: array
          items:
            $ref: '#/components/schemas/_shared_res_Mfa'
        account_id:
          type: string
        session_id:
          type: string
        state:
          type: string
        params:
          type: object
          nullable: true
          anyOf:
          - $ref: '#/components/schemas/_shared_res_ParamsOIDC'
          - $ref: '#/components/schemas/_shared_res_ParamsAPIKey'
          - $ref: '#/components/schemas/_shared_res_ParamsNone'
    _shared_req_Refresh:
      required:
      - api_key
      - refresh_token
      type: object
      properties:
        api_key:
          type: string
        refresh_token:
          type: string
    _shared_req_CredsTwilioPhone:
      type: object
      description: Auth login creds for auth_type="twilio_phone"
      required:
      - phone
      properties:
        phone:
          type: string
        code:
          type: string
    AdminToken:
      required:
      - token
      type: object
      properties:
        token:
          type: string
    SupportedAuthTypes:
      type: object
      properties:
        app_type_id:
          type: string
        supported_auth_types:
          type: array
          items:
            $ref: '#/components/schemas/SupportedAuthType'
    _shared_req_ParamsNone:
      type: object
      description: Auth login request params for unlisted auth_types (None)
      nullable: true
    _admin_req_grant-permissions:
      required:
      - permissions
      type: object
      properties:
        permissions:
          type: array
          items:
            type: string
    ValidIgnored:
      type: object
      properties:
        webtools_source:
          items:
            $ref: '#/components/schemas/WebtoolsSource'
        tps_api:
          items:
            $ref: '#/components/schemas/TPsSource'
    _admin_req_application_role:
      required:
      - name
      - description
      - permissions
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        system:
          type: boolean
        permissions:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
    _admin_req_revoke-permissions:
      required:
      - permissions
      type: object
      properties:
        permissions:
          type: array
          items:
            type: string
    _shared_req_CredsAPIKey:
      type: object
      description: Auth login creds for auth_type="anonymous"
      properties:
        anonymous_id:
          type: string
    _shared_req_Login_Mfa:
      required:
      - api_key
      - account_id
      - session_id
      - state
      - identifier
      - type
      - code
      type: object
      properties:
        api_key:
          type: string
        account_id:
          type: string
        session_id:
          type: string
        state:
          type: string
        identifier:
          type: string
        type:
          type: string
          enum:
          - email
          - phone
          - totp
          - recovery
