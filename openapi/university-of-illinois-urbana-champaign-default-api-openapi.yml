openapi: 3.2.0
info:
  title: Rokwire Gateway Building Block Default API
  description: Gateway Building Block API Documentation
  version: 2.21.1
servers:
- url: https://api.rokwire.illinois.edu/gateway
tags:
- name: Default
  description: Default APIs.
paths:
  /version:
    get:
      tags:
      - Default
      summary: Get version
      description: Gets current version of this service
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: string
                example: v1.0.0
        '500':
          description: Internal error
      operationId: getVersion
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
