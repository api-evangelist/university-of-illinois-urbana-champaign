- aid: university-of-illinois-urbana-champaign:incommon-shibboleth-idp
  name: Illinois Shibboleth Identity Provider (InCommon)
  x-operator: institution
  description: >-
    The campus SAML identity provider — the one surface a university operates by definition and
    almost never has catalogued. https://shibboleth.illinois.edu/idp/shibboleth serves a
    Shibboleth EntityDescriptor with entityID urn:mace:incommon:uiuc.edu, an IDPSSODescriptor
    supporting SAML 1.1 and SAML 2.0, and shibmd:Scope illinois.edu; the signing certificate is
    issued to shibboleth.illinois.edu, O=University of Illinois at Urbana-Champaign, OU=CITES. The
    same entity resolves through the InCommon metadata query service, so federated relying parties
    can consume it without a bilateral exchange. Machine-readable, unauthenticated, and stable.
  humanURL: https://techservices.illinois.edu/
  baseURL: https://shibboleth.illinois.edu/idp/shibboleth
  tags:
  - Identity Federation
  - Shibboleth
  - SAML
