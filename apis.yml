  detail: >-
    No wall. Every institution-operated surface claimed here was fetched and read, not linked:
    both Rokwire OpenAPI documents and nine live /version endpoints on api.rokwire.illinois.edu,
    the Course Explorer XML, the IDEALS OAI-PMH Identify/ListMetadataFormats/ListSets responses,
    the Illinois Data Bank catalog JSON (1,259 released datasets) and its DataCite registration,
    and the Shibboleth IdP metadata both on the campus host and through the InCommon metadata
    query service. Negative results are equally probed: illinois.edu returns HTTP 200 with a
    "404 - Page not found" body for /llms.txt and /.well-known/security.txt, so neither was
    credited. Two vendor tenancies (Elsevier Pure, Ex Libris Primo) were identified by
    fingerprinting the served page and are recorded as relationships without importing the
    vendors' contracts. Remaining gap is a harvest backlog, not a wall: seven live Rokwire
    building blocks (calendar, social, notifications, appointments, content, surveys, polls) are
    catalogued in lifecycle/ but have no contract in this repo yet.
