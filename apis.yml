- aid: university-of-illinois-urbana-champaign:illinois-data-bank
  name: Illinois Data Bank Dataset Metadata
  x-operator: institution
  description: >-
    The campus research data repository, built and run in-house by the University Library
    (github.com/medusa-project/databank, Ruby on Rails) rather than bought from Figshare, Dryad or
    Dataverse — which makes it one of the few genuinely institution-ENGINEERED research
    repositories in this cohort. Its catalog is machine-readable without authentication:
    /datasets.json returns all 1,259 released datasets with identifier, subject, publication and
    hold state, timestamps, citation and a per-dataset JSON URL. As a registered DataCite
    repository (client illinois.databank, member since 2018) it has minted 1,306 DOIs under prefix
    10.13012, 1,082 of which carry ORCID creator identifiers. There is no published API reference,
    no OAI-PMH endpoint on this host, and /api/* is a soft-404.
  humanURL: https://databank.illinois.edu/help
  baseURL: https://databank.illinois.edu
