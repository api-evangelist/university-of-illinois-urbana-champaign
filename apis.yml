aid: university-of-illinois-urbana-champaign
name: University of Illinois Urbana-Champaign
x-type: university
x-category: Public Research University
description: >-
  The University of Illinois Urbana-Champaign (UIUC) is the public land-grant flagship of the
  University of Illinois System and a founding Big Ten institution. It is one of the few
  universities in this cohort that genuinely ENGINEERS a public API estate rather than buying one:
  the Rokwire platform behind the official Illinois app is UIUC's own open-source work, published
  under Apache 2.0 in github.com/rokwire and deployed on the institution's own host at
  api.rokwire.illinois.edu, where nine building blocks answer an unauthenticated /version endpoint
  and two of them (Core 1.62.0, Gateway 2.21.1) publish OpenAPI 3.0 through Swagger UI. Around it
  sit four more institution-operated machine-readable surfaces: the Course Information Suite
  (CISAPI) Course Explorer, which serves class schedule and catalog XML with no authentication; the
  IDEALS institutional repository's OAI-PMH 2.0 endpoint, running on Illinois Library's own Rails
  application rather than a vendor platform; the Illinois Data Bank, an in-house research data
  repository that has minted 1,306 DataCite DOIs under prefix 10.13012 and exposes its catalog as
  JSON; and the campus Shibboleth identity provider, registered in InCommon as
  urn:mace:incommon:uiuc.edu. The estate is real but uneven — errors are documented in prose with
  no schemas, no deprecation policy or Sunset header exists anywhere, seven live Rokwire building
  blocks ship no contract at all, and illinois.edu answers /llms.txt and /.well-known/security.txt
  with a soft-404 that returns HTTP 200. Research profiles (Illinois Experts / Elsevier Pure) and
  library discovery (Ex Libris Primo) are vendor platforms recorded here as tenant relationships:
  the data is the university's, the contract is not.
