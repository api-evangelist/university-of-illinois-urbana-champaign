  name: Illinois Experts (Elsevier Pure)
  x-operator: tenant
  x-vendor: Elsevier
  x-vendor-platform: Pure / Pure Portal
  description: >-
    TENANT RELATIONSHIP, not a UIUC contract. Illinois Experts is the university's research
    information and expert-profile portal, and the data in it — people, publications, projects,
    units — is the university's. The software is Elsevier Pure: the served page identifies itself
    as "Pure Portal" and carries the Elsevier Fingerprint Engine, and the Pure web service under
    /ws/api redirects rather than answering anonymously. The Pure API contract belongs in
    Elsevier's own repo and is deliberately NOT saved here. Recorded because operating a research
    information system is a real institutional fact and one of the few programmable surfaces most
    universities have.
