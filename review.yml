        note: Live JWKS, RS256.
      - url: https://api.rokwire.illinois.edu/gateway/api/wayfinding/buildings
        status: 401
        note: >-
          Live and bearer-gated; error envelope is {"message":…,"status":"unauthorized"}, not
          RFC 9457.
      - url: https://api.rokwire.illinois.edu/core/api/wayfinding/buildings
        status: 404
        note: Negative control proving the Gateway slices' declared /core server was wrong.
      - url: https://www.ideals.illinois.edu/oai-pmh?verb=Identify
        status: 200
        note: >-
          OAI-PMH 2.0, repositoryName "IDEALS @ University of Illinois Urbana-Champaign",
          deletedRecord persistent. Requires a browser User-Agent; a bare agent gets 403.
      - url: https://databank.illinois.edu/datasets.json
        status: 200
        note: 1,259 released datasets, 726 KB, no authentication.
      - url: https://api.datacite.org/clients/illinois.databank
        status: 200
        note: DataCite repository registration for the Illinois Data Bank, member since 2018.
      - url: https://shibboleth.illinois.edu/idp/shibboleth
        status: 200
        note: Shibboleth IdP metadata, SAML 1.1 + 2.0, shibmd:Scope illinois.edu.
      - url: https://mdq.incommon.org/entities/urn:mace:incommon:uiuc.edu
        status: 200
        note: Same entity resolvable through the InCommon federation metadata query service.
      - url: https://experts.illinois.edu/
        status: 200
        note: Elsevier Pure Portal fingerprint — tenant, no vendor contract imported.
      - url: https://search.library.illinois.edu/discovery
        status: 200
        note: Redirects into primo.exlibrisgroup.com/discovery — Ex Libris tenant.
      - url: https://illinois.edu/llms.txt
        status: 200
        note: >-
          SOFT-404. Body is the "404 - Page not found | Illinois" template, byte-identical to
          https://illinois.edu/nonsense-xyz-123. Not credited.
  - date: '2026-06-03'
    rating: 4
    summary: >-
      UIUC has a strong, genuinely public developer footprint. The Course Explorer CISAPI
      (schedule + catalog) is documented and serves data with no authentication, verified
      live returning XML. The open-source Rokwire platform behind the official Illinois
      app exposes documented Core and Gateway building-block APIs (Swagger UIs live) with
      Apache 2.0 source on the rokwire GitHub org (30 repos). The IDEALS institutional
      repository OAI-PMH endpoint responds to verb=Identify. No fabricated endpoints:
      api.rokwire.illinois.edu root and /docs/ both 404 so were not cataloged. LinkedIn
      returns 999 (anti-bot) but is the canonical school URL.
